; 单位简介百科 - 单位数据配置文件
;
; 如何添加/修改单位：
; 1. 在某个阵营的 section（如 [Soviet]）中增加一行，格式：Unit序号=中文名|英文Key
;    并把该阵营的 UnitCount 数字加 1
; 2. 新增一个详细资料 section，名字用"英文Key"，格式如下：
;    [英文Key]
;    Name=单位中文名
;    Gif=单位动画文件名.gif
;    Description=单位详细介绍文字（可写多行，用 | 分隔换行）
;
; 例子：
; [Soviet]
; UnitCount=5
; Unit4=疯狂伊文|CrazyIvan
;
; [CrazyIvan]
; Name=疯狂伊文
; Gif=crazyivan.gif
; Description=疯狂伊文是苏联的爆破专家...
;
; GIF 文件放在 Resources/Encyclopedia/ 目录下，文件名用英文避免编码问题。

