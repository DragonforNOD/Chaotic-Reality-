[Conscript]
Name=动员兵
Gif=conscript.gif
Description=动员兵是苏军的基础步兵单位，装备有轻型冲锋枪。他们造价低廉，可以大量生产，在战斗中充当炮灰和占领建筑的先锋。虽然单兵作战能力较弱，但凭借数量优势依然具有不俗的战斗力。

[TeslaTrooper]
Name=磁暴步兵
Gif=teslatrooper.gif
Description=磁暴步兵是苏军的精英反装甲步兵，装备了特斯拉线圈武器，能够对装甲单位和建筑物造成巨大的电磁伤害。他们还是磁暴线圈的维护单位，可以为其充能增强威力。

[Kirov]
Name=基洛夫飞艇
Gif=kirov.gif
Description=基洛夫飞艇是苏军的战略轰炸飞艇，装备了重型炸弹，可以对地面目标进行毁灭性打击。它移动缓慢但防护坚固，是苏军最具威慑力的空中力量之一。

[Apocalypse]
Name=天启坦克
Gif=apocalypse.gif
Description=天启坦克是苏军的重型主战坦克，装备有双管磁炮和导弹发射器，拥有极高的装甲和火力。它是陆地上的移动要塞，能够摧毁任何敢于阻挡的敌人。

[GrizzlyTank]
Name=灰熊坦克
Gif=grizzlytank.gif
Description=灰熊坦克是盟军的基础主战坦克，装备有标准坦克炮，机动性和火力较为均衡。它是盟军地面部队的中坚力量，通常与其他单位配合行动。

[GI]
Name=美国大兵
Gif=gi.gif
Description=美国大兵是盟军的基础步兵单位，装备有突击步枪，进驻建筑后可以大幅提升火力输出。他们可以部署（按D键）架起沙袋，获得更高的防御和攻击力。

[PrismTank]
Name=光棱坦克
Gif=prismtank.gif
Description=光棱坦克是盟军的高科技反装甲坦克，装备有棱镜光束武器，能够对敌人造成连锁伤害。虽然装甲较薄，但强大的攻击力让它成为战场上的致命威胁。

[Initiate]
Name=尤里新兵
Gif=initiate.gif
Description=尤里新兵是尤里阵营的基础步兵单位，装备有心灵感应武器。他们能够进行心灵攻击，同时可以占领中立建筑，是尤里扩张势力的重要力量。

[Magnetron]
Name=磁电坦克
Gif=magnetron.gif
Description=磁电坦克是尤里阵营的独特武器，利用磁力将敌方单位从地面抬起并拖拽到己方阵地。它能将敌军坦克吸过来，甚至将其坠毁造成伤害，是一种极具战略价值的单位。

[Mastermind]
Name=心灵控制车
Gif=mastermind.gif
Description=心灵控制车是尤里阵营的终极武器，能够同时控制多个敌方单位，并利用被控制的单位攻击其同伴。它是最强大的心理武器之一，能够彻底颠覆战局。

[ShogunExecutioner]
Name=鬼王机甲
Gif=shogunexecutioner.gif
Description=鬼王机甲是升阳帝国的重型两足机甲，装备有巨型剑刃和冲锋炮，能够直接劈砍敌人并发射高威力炮弹。它外形酷似日本武士，是帝国军力的象征。

[MegaFortress]
Name=要塞要塞
Gif=megafortress.gif
Description=要塞是升阳帝国的巨型水上堡垒，能够漂浮在海面上并搭载多座炮塔。它可以像战舰一样开炮攻击，同时还能搭载步兵单位，是海陆两栖的移动要塞。

[TsunamiTank]
Name=钢铁浪人
Gif=tsunamitank.gif
Description=钢铁浪人是升阳帝国的两栖坦克，能够在陆地和海面上自由移动，装备有先进的光子炮。它的高速机动性和两栖能力使其成为奇袭作战的利器。

[ChaosWalker]
Name=混沌行者
Gif=chaoswalker.gif
Description=混沌行者是混沌势力的基础步兵单位，装备有扭曲现实的能量武器。他们行走在混乱与疯狂的边缘，其攻击能够随机产生各种异常效果，让敌人防不胜防。

[NightmareTank]
Name=梦魇战车
Gif=nightmaretank.gif
Description=梦魇战车是混沌势力的重型战车，其装甲由噩梦能量凝结而成。它能够吸取周围的恐惧增强自身力量，向敌人投射毁灭性的暗影炮火。

[VoidWeaver]
Name=虚空编织者
Gif=voidweaver.gif
Description=虚空编织者是混沌势力的终极单位，能够撕裂空间，召唤虚空裂缝吞噬敌人。它操控着维度的力量，是混沌秩序中最可怕的战争机器。