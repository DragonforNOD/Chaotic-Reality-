; ***************************************************************************
; ******************* 欧洲联盟 — 闪电塔 Art 设置 ***************************
; ***************************************************************************
; 参照: artmd.ini 中 [NATSLA](磁暴线圈) + [GTGCAN](巨炮) 格式
; Foundation=2x2 对应 rulesCR.ini 中的 2x2 占地
; ***************************************************************************

; ============ 建筑 Art ============
; 参照: [GTGCAN] 巨炮 art 格式 (2x2地基)
; Image/Buildup/Cameo 留空由用户自行填写
[GALSTWR]
Remapable=yes                           ; 使用玩家色
NewTheater=yes                          ; 场景换图(雪地/城市等)
Cameo=                                  ; 侧边栏图标(用户自行填写)
Image=gaweather1                                  ; 建筑主图像SHP(用户自行填写)
Foundation=2x2                          ; 2x2地基(对应rules占地)
Height=4                                ; 建筑高度
Buildup=gaweather1                                ; 建造动画(用户自行填写)
DemandLoadBuildup=true                  ; 按需加载建造动画
FreeBuildup=true                        ; 释放建造动画内存
PrimaryFireFLH=200,0,350               ; 开火位FLH(前200,左0,高350)
; FLH格式: X,Y,Z (前,左,高) 单位lepton, 256lepton=1格

; ============ 开火动画 ============
; WCLBOLT1-3 已在 artmd.ini 中定义, 无需重复
; [WCLBOLT1-3] Layer=ground
; 闪电束动画由弹头 AnimList 引用, 不需要额外 art 条目

; ============ 抬高雷云动画 ============
; 使用 WCCLOUD1.shp 的图像, 但通过 ZAdjust 抬高到天空位置
; WCCLOUD1 原始定义在 artmd.ini: Rate=375 Layer=Top AltPalette=yes (无ZAdjust, 在地面)
; GALCLOUD 加上 ZAdjust=-400 使雷云出现在闪电上方(负数=向上偏移)
; 参照: artmd.ini 中 ZAdjust=-300 的 Layer=Top 动画用法
[GALCLOUD]
Image=WCCLOUD1                           ; 使用闪电风暴雷云SHP图像
Rate=375                                 ; 动画速率(同原版)
Layer=Top                                ; 顶层渲染(在单位上方)
AltPalette=yes                           ; 使用特殊调色板
ZAdjust=-400                             ; 垂直偏移(负数=向上, -400≈抬高到天空位置)
