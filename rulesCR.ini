; ***************************************************************************
; ******************* 欧洲联盟 — 闪电塔 (Lightning Tower) *******************
; ***************************************************************************
;
; 攻击流程：
;   1. 远程检测敌人 (Sight=8, Range=8)
;   2. 不可见抛射体瞬间命中目标 (Projectile Inviso=yes)
;   3. 弹头触发 Ares PreImpactAnim → 先在目标位置播放抬高雷云 (GALCLOUD, ZAdjust=-400)
;   4. 雷云动画播完后 → 弹头引爆 → AnimList 播放闪电束 (WCLBOLT1-3) + 3x3范围伤害
;
; 素材来源：
;   雷云动画: WCCLOUD1.shp (闪电风暴小雷云, 位于 conquer.mix)
;   闪电束:   WCLBOLT1-3.shp (闪电风暴闪电, 位于 conquer.mix)
;   命中爆炸: EXPLOLB.shp (闪电命中特效, 位于 conquer.mix)
;
; 参照格式: rulesmd.ini 中 ATESLA(棱镜塔) / TESLA(磁暴线圈) / GTGCAN(巨炮)
; ***************************************************************************

; ============ 建筑主体 ============
; 参照: [ATESLA] 棱镜塔 + [TESLA] 磁暴线圈 格式
; 2x2占地, 远程防御塔, 需供电
[GALSTWR]
UIName=Name:GALSTWR
Name=Lightning Tower
Image=gaweather1                        ; 用户自行填写建筑SHP图像
BuildCat=Combat
Prerequisite=GATECH,GACNST              ; 前置: 高科技+盟军建造厂
TechLevel=10                            ; 科技等级(10=最高)
Strength=800                            ; 生命值
Armor=steel                             ; 护甲类型
Adjacent=2                              ; 可相邻建造距离
Sight=8                                 ; 视野范围(远程检测)
Owner=British,French,Germans,Americans,Alliance
AIBasePlanningSide=0                    ; 0=盟军AI
Cost=2000                               ; 造价
Points=30                               ; 击杀得分
Power=-100                              ; 耗电量(负数=耗电)
Crewed=no                               ; 被摧毁后不产生幸存者
Capturable=false                        ; 不可被工程师占领
Primary=LightningBolt                   ; 主武器
Turret=no                               ; 无炮塔(闪电塔无需转向)
Explosion=TWLT070,S_BANG48,S_BRNL58,S_CLSN58,S_TUMU60
DebrisAnims=DBRIS1LG,DBRIS1SM,DBRIS4LG,DBRIS4SM,DBRIS5LG,DBRIS5SM
MaxDebris=8
MinDebris=4
ThreatPosed=40                          ; AI威胁值(防御建筑用)
DamageParticleSystems=SparkSys,SmallGreySSys,BigGreySmokeSys
DamageSmokeOffset=96, 64, 112
IsBaseDefense=yes                       ; AI识别为防御建筑
BaseNormal=no                           ; 不是基地核心建筑
Powered=yes                             ; 需要供电才能运作
HasStupidGuardMode=false                ; 关闭愚蠢守卫模式
WorkingSound=PowerOn                    ; 有电音效
NotWorkingSound=PowerOff                ; 断电音效
ImmuneToPsionics=no                     ; 可被心灵控制(建筑默认yes, 改no)
Drainable=yes                           ; 可被发电厂超载
AntiInfantryValue=25                    ; AI反步兵价值
AntiArmorValue=25                       ; AI反载具价值
AntiAirValue=0                          ; AI反空军价值(闪电塔不对空)
HasRadialIndicator=yes                  ; 显示攻击范围指示器
AIBuildThis=yes                         ; AI会建造此建筑
ProtectWithWall=yes                     ; AI会用围墙保护

; ============ 武器 ============
; 参照: [PrismShot] 棱镜武器 + [CoilBolt] 磁暴武器 格式
; 不设 Anim (不在塔本身播放动画)
; 雷云+闪电束动画全部由弹头 AnimList 在目标位置播放
[LightningBolt]
Damage=120                              ; 单次伤害
ROF=90                                  ; 开火间隔(帧, 越小越快)
Range=8                                 ; 射程(格)
MinimumRange=3                          ; 最小射程
Speed=100                               ; 抛射体速度
Projectile=LightningProj                ; 关联抛射体
Warhead=LightningWH                     ; 关联弹头
Report=WeatherStrike                    ; 开火音效(闪电风暴音效)
Bright=yes                              ; 开火闪光

; ============ 抛射体 ============
; 参照: [InvisibleHigh] 格式
; Inviso=yes 瞬间命中, 不显示抛射体图像
; 闪电束的视觉效果由弹头 AnimList 表现
[LightningProj]
Inviso=yes                              ; 瞬间命中(不可见)
Image=none                              ; 无图像
SubjectToElevation=yes                  ; 受地形高度影响
AA=yes                                  ; 可对空
AG=yes                                  ; 可对地

; ============ 弹头 ============
; 参照: [GrandCannonWH] 巨炮弹头 + [PrismWarhead] 棱镜弹头 格式
; CellSpread=1.5 约覆盖3x3范围
; PreImpactAnim: Ares扩展, 命中前先播放雷云动画(动画非循环)
; AnimList: PreImpactAnim播放完毕后再播放闪电束动画
; PercentAtMax 边缘伤害比例
; Sparky=no 必须写no否则崩溃(知识库铁律)
[LightningWH]
CellSpread=1.5                          ; 溅射范围(1.5格≈3x3区域)
PercentAtMax=0.5                        ; 边缘伤害比例50%
Wall=yes                                ; 可摧毁围墙
Wood=yes                                ; 可摧毁树木
Sparky=no                               ; 必须no! 否则崩溃(知识库铁律)
Conventional=yes                        ; 打水溅水花
Rocker=yes                              ; 掀翻车辆
Verses=100%,100%,100%,100%,100%,100%,50%,100%,50%,100%,100%
; Verses对应11种护甲: None,Flak,Plate,Light,Medium,Heavy,Wood,Steel,Concrete,Special_1,Special_2
PreImpactAnim=GALCLOUD                   ; Ares: 命中前先播放抬高雷云(artCR.ini中定义, ZAdjust=-400)
AnimList=WCLBOLT1,WCLBOLT2,WCLBOLT3    ; 雷云播完后再播放闪电束(随机选一个)
InfDeath=5                              ; 步兵死亡动画(5=电死)
ProneDamage=50%                         ; 卧倒单位伤害比例

